services:
    postgres:
        build: .
        container_name: jord-sentinel-postgres
        restart: always
        environment:
            POSTGRES_DB: ${POSTGRES_DB:-jord}
            POSTGRES_USER: ${POSTGRES_USER:-postgres}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
        ports:
            - "${POSTGRES_PORT:-5432}:5432"
        volumes:
            - ./backend/.postgres:/var/lib/postgresql
